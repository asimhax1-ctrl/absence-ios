name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          echo "::notice title=xcodes::$(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
          # أحدث Xcode (26+) = واجهة iOS 26 الزجاجية تلقائيًا
          XC="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          echo "::notice title=xcode::$(xcodebuild -version | tr '\n' ' ')"

      - name: Generate project
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate 2>&1 | tail -5
          echo "::notice title=xcodegen::$(xcodegen --version) — $(ls -d *.xcodeproj)"

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild -project Absence.xcodeproj -scheme Absence -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          RC=$?
          echo "::notice title=xcodebuild::exit $RC — $(grep -E 'BUILD (SUCCEEDED|FAILED)' build.log | tail -1)"
          # أول 40 خطأ كتعليقات قابلة للقراءة عبر الـ API
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::warning title=compile::${line//$'\n'/ }"
          done
          tail -4 build.log | while IFS= read -r line; do echo "::notice title=tail::$line"; done
          APP=build/Build/Products/Release-iphoneos/Absence.app
          echo "::notice title=app::$(du -sh $APP 2>&1 | tr '\t' ' ') | $(ls $APP 2>&1 | tr '\n' ' ' | head -c 600)"
          echo "::notice title=plugins::$(ls $APP/PlugIns 2>&1 | tr '\n' ' ')"
          test $RC -eq 0 && test -f $APP/Absence

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Absence.app Payload/
          zip -qry Absence.ipa Payload
          echo "::notice title=ipa::$(ls -lh Absence.ipa | awk '{print $5}')"

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Absence.ipa --title "حاسبة الحرمان $TAG" \
            --notes "IPA غير موقّع — وقّعه بـ ESign. الرابط الثابت لآخر نسخة: https://github.com/${{ github.repository }}/releases/latest/download/Absence.ipa" --latest
